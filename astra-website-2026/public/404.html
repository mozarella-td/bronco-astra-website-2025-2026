<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>astra-website-2026</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This 404.html redirects to index.html, encoding the originally
      // requested path so index.html's script can restore it via
      // history.replaceState before React Router ever sees a mismatch.
      var pathSegmentsToKeep = 0; // deployed at domain root (broncoastra.us)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
